services:
  api:
    build:
      # Build context is the repo root so the Dockerfile can pull in both
      # api/ (FastAPI service) and admin/ (Vite SPA, built in stage 1).
      context: .
      dockerfile: api/Dockerfile
    image: vr-sop-manual-api:latest
    container_name: vr-sop-manual-api
    ports:
      - "8000:8000"
    volumes:
      - ./api/storage:/data/storage
    environment:
      STORAGE_DIR: /data/storage
    restart: unless-stopped
